[package]
name = "social"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
