[package]
name = "social"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# SQLite is a small share of request CPU; optimise its C code for size.
[profile.release.package.libsqlite3-sys]
opt-level = "s"
